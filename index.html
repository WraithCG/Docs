<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WraithCG | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark-orange">

    <div class="ambient-glow" id="ambient-glow"></div>

    <div class="mobile-header glass-panel">
        <div class="header-left">
            <button id="mobile-menu-btn" class="icon-btn" aria-label="Toggle Menu"><i class="ph ph-list"></i></button>
        </div>
        <div class="header-center">
            <div class="logo">wRAiTH<span>_CG</span></div>
        </div>
        <div class="header-right theme-toggle-wrapper">
            <button class="theme-toggle-mobile" id="theme-btn-mobile" aria-label="Cycle Theme">
                <i class="ph ph-palette"></i>
            </button>
            <span class="theme-tooltip" id="theme-tooltip-mobile">Dark Orange</span>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="mobile-sidebar glass-panel" id="mobile-sidebar">
        <div class="sidebar-header">
            <div class="logo">Links</div>
            <button id="close-sidebar" class="icon-btn"><i class="ph ph-x"></i></button>
        </div>
        <div class="sidebar-links">
            <a href="https://wraithcg.github.io/me" title="View Portfolio"><i class="ph ph-user"></i> Portfolio</a>
            <a href="https://discord.gg/yourserver" title="Discord"><i class="ph ph-discord-logo"></i> Discord</a>
            <a href="https://fab.com/sellers/yourprofile" title="Store"><i class="ph ph-storefront"></i> Store</a>
        </div>
    </div>

    <div class="layout-single">
        
        <header class="top-header glass-panel">
            <div class="header-left">
            </div>
            
            <div class="header-center">
                <div class="logo">wRAiTH<span>_CG</span></div>
            </div>
            
            <div class="header-right">
                <div class="theme-toggle-wrapper">
                    <button class="theme-toggle" id="theme-btn" aria-label="Cycle Theme">
                        <i class="ph ph-palette"></i>
                    </button>
                    <span class="theme-tooltip" id="theme-tooltip">Dark Orange</span>
                </div>
            </div>
        </header>

        <div class="sub-header glass-panel">
            <a href="https://wraithcg.github.io/me" class="sub-link"><i class="ph ph-user"></i> Portfolio</a>
            <a href="https://discord.gg/yourserver" class="sub-link"><i class="ph ph-discord-logo"></i> Discord</a>
            <a href="https://fab.com/sellers/yourprofile" class="sub-link"><i class="ph ph-storefront"></i> Store</a>
        </div>

        <main class="landing-container">
            <div class="landing-header">
                <h1>Select a <span>Project</span></h1>
                <!-- <p>Explore My Portfolio of Game Systems and Templates :)</p> -->
                
                <!-- View Toggle Buttons -->
                <div class="view-toggle">
                    <button id="view-grid-btn" class="active" aria-label="Grid View"><i class="ph ph-squares-four"></i></button>
                    <button id="view-list-btn" aria-label="List View"><i class="ph ph-list-dashes"></i></button>
                </div>
            </div>
            
            <div id="project-grid" class="project-grid">
                <!-- Project Cards Injected via JS -->
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
